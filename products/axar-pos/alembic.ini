# Usage (owner/admin connection; never the app role):
#   AXAR_POS_ADMIN_DATABASE_URL=postgresql+psycopg://owner@host/db alembic upgrade head
[alembic]
script_location = axar_pos/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
