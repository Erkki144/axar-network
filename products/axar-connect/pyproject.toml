[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "axar-connect"
version = "0.1.0"
requires-python = ">=3.11"
description = "Provider-neutral AXAR POS accounting and bank integration primitives"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
