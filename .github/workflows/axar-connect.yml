name: axar-connect
on:
  pull_request:
    paths:
      - 'products/axar-connect/**'
      - '.github/workflows/axar-connect.yml'
  push:
    branches: [main]
    paths:
      - 'products/axar-connect/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/axar-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
