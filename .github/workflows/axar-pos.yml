name: axar-pos

on:
  pull_request:
    paths:
      - "products/axar-pos/**"
      - ".github/workflows/axar-pos.yml"
  push:
    branches: [main]
    paths:
      - "products/axar-pos/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/axar-pos/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -p no:cacheprovider
