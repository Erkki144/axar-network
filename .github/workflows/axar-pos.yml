name: axar-pos

on:
  pull_request:
    paths:
      - "products/axar-pos/**"
      - ".github/workflows/axar-pos.yml"
  push:
    branches: [main]
    paths:
      - "products/axar-pos/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/axar-pos/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -p no:cacheprovider

  browser-e2e:
    # AXAR ONE cashier UI against a real local uvicorn (127.0.0.1 only).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/axar-pos/requirements-e2e.txt
      - run: pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests_e2e -p no:cacheprovider -rA
