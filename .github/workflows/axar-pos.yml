name: axar-pos

# Runs on EVERY pull request so its jobs can be required status checks in
# branch protection: when a PR does not touch the POS, the `changes` job says
# so and the test jobs are skipped - a skipped job counts as passed for a
# required check, so website-only PRs are not blocked.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "products/axar-pos/**"
      - "products/axar-one/**"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pos: ${{ steps.detect.outputs.pos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail-safe: if the diff cannot be computed, run everything.
          if ! changed=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then
            echo "pos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(products/axar-pos/|products/axar-one/|\.github/workflows/axar-pos\.yml$)'; then
            echo "pos=true" >> "$GITHUB_OUTPUT"
          else
            echo "pos=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files:"; echo "$changed" | head -50

  test:
    needs: changes
    if: needs.changes.outputs.pos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/axar-pos/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -p no:cacheprovider

  test-postgres:
    # Whole suite on PostgreSQL 16 as the non-owner, RLS-bound role axar_app,
    # plus PostgreSQL-only tests (RLS, grants, drift, real lock interleavings).
    needs: changes
    if: needs.changes.outputs.pos == 'true'
    runs-on: ubuntu-24.04   # pinned: needs postgresql-client-16 (not packaged on 26.04)
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axar_owner
          POSTGRES_PASSWORD: ci_only_owner_pw   # throwaway CI container, not a secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axar_owner" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      AXAR_TEST_PG: postgresql+psycopg://axar_owner:ci_only_owner_pw@127.0.0.1:5432
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/axar-pos/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: PostgreSQL 16 client tools (backup tests need pg_dump/pg_restore = server major)
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version
      - run: python -m pytest -p no:cacheprovider -rs
      - name: PostgreSQL-only tests must not be skipped (RLS/grants + backup/restore drill)
        run: |
          python -m pytest tests/test_postgres.py tests/test_backup_restore.py -p no:cacheprovider -rs -v | tee pg.txt
          ! grep -qi skipped pg.txt
          grep -c "test_backup_restore.py::.* PASSED" pg.txt

  browser-e2e:
    # AXAR ONE cashier UI against a real local uvicorn (127.0.0.1 only).
    needs: changes
    if: needs.changes.outputs.pos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/axar-pos/requirements-e2e.txt
      - run: pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests_e2e -p no:cacheprovider -rA

  dependency-audit:
    # #34 SEC-3: known vulnerabilities in pinned Python dependencies (PyPI/OSV advisories).
    # Fails the build on any finding; upgrade the pin (and re-run all suites) to fix.
    needs: changes
    if: needs.changes.outputs.pos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/axar-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-e2e.txt --strict
