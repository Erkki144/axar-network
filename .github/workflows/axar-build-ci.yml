name: AXAR BUILD and EXPERIENCE validation

on:
  pull_request:
    paths:
      - 'products/axar-build/**'
      - 'products/axar-experience/**'
      - '.github/workflows/axar-build-ci.yml'
      - '.github/workflows/axar-agent-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic planner tests
        working-directory: products/axar-build
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q
          python -m axar_build.cli plan backlog.json
      - name: Run UX calculations and state tests
        run: node --test products/axar-experience/tests/*.test.mjs
      - name: Verify all demo code parses
        run: |
          node --check products/axar-experience/prototype/app.mjs
          node --check products/axar-experience/prototype/money.mjs

  browser-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Exercise express, restaurant, kitchen and mobile flows
        run: python products/axar-experience/tests/e2e_smoke.py
